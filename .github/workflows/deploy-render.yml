# Setiap push ke main: jalankan tes, lalu bila lulus picu deploy di Render.
# Butuh secret repo RENDER_DEPLOY_HOOK (Render -> layanan SANDAR -> Settings -> Deploy Hook).
name: Tes dan deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tes backend
        working-directory: backend
        run: |
          python -m pip install -q -r requirements-dev.txt
          python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Tes dan build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

  deploy:
    needs: tes
    runs-on: ubuntu-latest
    steps:
      - name: Picu deploy Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::Secret RENDER_DEPLOY_HOOK belum diisi; deploy dilewati."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Deploy Render dipicu."
